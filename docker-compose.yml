services:
  application:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: application
    depends_on:
      openfga:
        condition: service_started
      postgres:
        condition: service_healthy
    env_file: .env
    networks:
      - openfga
    volumes:
      - ./logs:/app/logs
      - ./volumes/openfga:/tmp/openfga

  openfga:
    build:
      args:
        - OPENFGA_CLI_VERSION=${OPENFGA_CLI_VERSION}
        - OPENFGA_VERSION=${OPENFGA_VERSION}
      context: ./
      dockerfile: Dockerfile.openfga
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    networks:
      - openfga
    ports:
      - "3000:3000"
      - "8080:8080"
    volumes:
      - ./volumes/tls_certificates:/usr/local/share/ca-certificates

  postgres:
    build:
      context: ./
      dockerfile: Dockerfile.postgres
    container_name: postgres
    env_file: .env
    environment:
      PGCLIENTENCODING: UTF8
      PGPORT: ${DB_PORT}
      PGTZ: UTC
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - openfga
    ports:
      - "5432:5432"
    volumes:
      - ./volumes/tls_certificates:/usr/local/share/ca-certificates
      - ./volumes/database/init.sh:/docker-entrypoint-initdb.d/init.sh
      - ./volumes/database/postgresql.conf:/etc/postgresql.conf

networks:
  openfga: